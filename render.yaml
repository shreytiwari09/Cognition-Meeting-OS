services:
  - type: web
    name: cognition-meetingos-backend
    runtime: python
    pythonVersion: "3.12"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_MODEL
        value: gemini/gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      # Whisper on Groq, for call audio recorded by the extension (optional; captions are the fallback)
      - key: GROQ_API_KEY
        sync: false
      # Firebase Admin service-account JSON, pasted on one line
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      # Comma-separated frontend origins, e.g. https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_NAME
        value: Cognition MeetingOS
    plan: free
